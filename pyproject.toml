[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-project"
version = "0.1.0"
description = "A basic LangChain/LangGraph agent project with tool calling and multi-provider model support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "sentence-transformers>=3.0.0",
    "typing-extensions>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
agent-chat = "agent_project.cli:main"
agent-feishu-watch = "agent_project.feishu_watch:main"
agent-file-rl = "agent_project.agent_rl.filesystem.rollout:main"
agent-file-rl-generate = "agent_project.agent_rl.filesystem.generate:main"
agent-file-rl-dpo-generate = "agent_project.agent_rl.filesystem.dpo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
